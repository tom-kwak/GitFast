# cargo-deny configuration. Revisit `licenses.allow` once the project license
# is decided (PLAN.md §10).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates deep in iced / syntect / rfd have no replacement we
# control; flag only the ones gf depends on directly. Vulnerabilities are
# always reported.
unmaintained = "workspace"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    # Boost: permissive (clipboard-win, error-code via iced's clipboard).
    "BSL-1.0",
]
confidence-threshold = 0.9
# Workspace crates are not published.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
