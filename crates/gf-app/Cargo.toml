[package]
name = "gf-app"
description = "gf desktop application (iced UI). Composes the core crates into features."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gf"
path = "src/main.rs"

[dependencies]
gf-core.workspace = true
gf-config.workspace = true
gf-git.workspace = true
gf-watch.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
iced = { workspace = true, features = ["tokio", "advanced"] }
rfd.workspace = true
syntect.workspace = true
two-face.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["sync", "macros"] }
tokio-stream = { workspace = true, features = ["sync"] }
unicode-segmentation = "1"

[dev-dependencies]
iced_test = "0.14"
gf-test-support.workspace = true
tempfile.workspace = true

[lints]
workspace = true
