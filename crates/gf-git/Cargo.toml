[package]
name = "gf-git"
description = "Git backend: system git CLI runner, porcelain parsers and gix-based fast reads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["gix", "gix-fetch"]
# In-process reads and ref edits via gitoxide (see docs/GIX_MIGRATION.md).
# Without it every command goes through the git CLI.
gix = ["dep:gix"]
# Fetch via gitoxide, used only when the `git.gix_fetch` setting is on.
# HTTPS through the system TLS (Security.framework on macOS), like git.
gix-fetch = [
    "gix",
    "gix/blocking-network-client",
    "gix/blocking-http-transport-reqwest-native-tls",
    "gix/progress-tree",
]

[dependencies]
gf-core.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "rt", "sync", "macros", "time", "fs"] }
tokio-util.workspace = true
tracing.workspace = true
gix = { workspace = true, optional = true, features = ["revision", "status", "sha1", "parallel", "pack-cache-lru-static"] }

[dev-dependencies]
gf-test-support.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "rt", "rt-multi-thread", "sync", "macros", "time"] }

[lints]
workspace = true
