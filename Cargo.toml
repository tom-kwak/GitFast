[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.12"
edition = "2024"
rust-version = "1.92"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# internal (commented entries are enabled once a crate depends on them)
gf-core = { path = "crates/gf-core" }
gf-git = { path = "crates/gf-git" }
# gf-commands = { path = "crates/gf-commands" }
# gf-flow = { path = "crates/gf-flow" }
# gf-hosting = { path = "crates/gf-hosting" }
# gf-hosting-gitlab = { path = "crates/gf-hosting-gitlab" }
# gf-hosting-github = { path = "crates/gf-hosting-github" }
# gf-auth = { path = "crates/gf-auth" }
gf-config = { path = "crates/gf-config" }
gf-watch = { path = "crates/gf-watch" }
gf-test-support = { path = "crates/gf-test-support" }

# external
thiserror = "2"
anyhow = "1"
tokio = { version = "1.54", default-features = false }
tokio-util = { version = "0.7", default-features = false }
gix = { version = "0.90", default-features = false }
uuid = { version = "1", features = ["v4"] }
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tempfile = "3"
notify = "8"
syntect = { version = "5.3", default-features = false, features = ["default-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
serde_json = "1"
notify-debouncer-mini = "0.7"
iced = { version = "0.14", features = ["canvas"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
toml = "1"
tokio-stream = { version = "0.1", default-features = false }

[patch.crates-io]
# Backport rust-windowing/winit#4478 to 0.30.13 for macOS Korean IME.
# Remove it when the fix ships in a winit release supported by iced.
winit = { git = "https://github.com/zilhak/winit-ime-fix", rev = "065d1a09cde54e476dd7f611855f00a1a36bbe10" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Debug builds: optimize dependencies (iced, wgpu, syntect, gix…) so the UI
# is responsive under `cargo run`, while gf's own crates stay debuggable.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
