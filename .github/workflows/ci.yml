name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  # release.yml runs this on the commit it is about to release.
  workflow_call:
    inputs:
      ref:
        description: Commit to check (default the one that triggered)
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Add ubuntu-latest / windows-latest here in M9.
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  # Clicks every button on screen headless (app/ui_sweep.rs). For a
  # release, release.yml runs it beside the .dmg build instead.
  ui-sweep:
    name: UI sweep (every button does something)
    if: ${{ github.workflow == 'CI' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p gf-app -- --ignored sweep_

  deny:
    name: cargo-deny (licenses, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: EmbarkStudios/cargo-deny-action@v2
