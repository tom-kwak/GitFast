name: Release

# A tag `release-<version>` (the workspace version in Cargo.toml) on a
# commit that is in main publishes a release with the macOS .dmg files (Apple silicon and
# Intel) and the Windows .zip: either
# the tag is pushed onto a commit main already has, or main gets the
# tagged commit later (a merge of develop). A tag on a commit main does
# not have waits until main has it.
#
#   git tag release-0.0.2 && git push origin release-0.0.2
#
# Every other push to main runs the UI sweep on main here (CI sweeps only
# pull requests into main), so each commit is swept once.
on:
  push:
    branches: [main]
    tags: ["release-*"]
    # Changes to docs alone do not run it (tag pushes ignore this filter).
    paths-ignore:
      - "**.md"
      - "docs/**"

# One at a time: a push of main and its tag together release once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Which tag to release: the newest release-* tag in main that has no
  # release yet (none: nothing to do). And what to sweep: that tag, else
  # main after a push to it, unless a release tag already sits on that
  # commit (its release swept it).
  resolve:
    name: Find the tag to release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      sweep: ${{ steps.find.outputs.sweep }}
      tested: ${{ steps.find.outputs.tested }}
    # `gh run list` below reads the CI runs.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Start from main so checkout leaves annotated tag refs intact.
          ref: main
          fetch-depth: 0
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q --tags origin +refs/heads/main:refs/remotes/origin/main
          released="$(gh release list --limit 1000 --json tagName -q '.[].tagName')"
          tag=""
          for t in $(git tag -l 'release-*' --merged origin/main --sort=-v:refname); do
            if ! grep -qxF "$t" <<<"$released"; then tag="$t"; fi
            break
          done
          if [ -z "$tag" ]; then
            echo "No release tag in main without a release: nothing to publish."
          else
            echo "Releasing $tag ($(git rev-parse "$tag^{commit}"))"
          fi
          # A CI run (a push to develop or main, a pull request) already
          # passed on the tagged commit: the release need not run the same
          # checks again (on Windows they take 20+ minutes).
          tested=""
          if [ -n "$tag" ]; then
            passed="$(gh run list --workflow ci.yml --status success \
              --commit "$(git rev-parse "$tag^{commit}")" \
              --json databaseId -q length)"
            [ "${passed:-0}" -gt 0 ] && tested=true
            echo "CI already passed on the tagged commit: ${tested:-no}"
          fi
          sweep="$tag"
          if [ -z "$sweep" ] && [ "$GITHUB_REF_TYPE" = branch ] &&
             [ -z "$(git tag -l 'release-*' --points-at "$GITHUB_SHA")" ]; then
            sweep="$GITHUB_SHA"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sweep=$sweep" >> "$GITHUB_OUTPUT"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  # Skipped when CI already passed on that commit (`tested`): the packages
  # below then follow without it.
  ci:
    needs: resolve
    if: needs.resolve.outputs.tag != '' && needs.resolve.outputs.tested != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.tag }}

  # Runs beside the checks and the .dmg build; the release waits for it.
  # With nothing to release it checks main alone.
  ui-sweep:
    name: UI sweep (every button does something)
    needs: resolve
    if: needs.resolve.outputs.sweep != ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sweep }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p gf-app -- --ignored sweep_

  macos:
    name: Package (macOS ${{ matrix.arch }})
    needs: [resolve, ci]
    # `ci` is skipped when the commit passed CI already; it must not have
    # failed. Nothing to release: nothing to package.
    if: ${{ !failure() && !cancelled() && needs.resolve.outputs.tag != '' }}
    # Each architecture is built natively on its own runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest }
          - { arch: x86_64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}

      - name: Version
        id: version
        run: |
          tag="${{ needs.resolve.outputs.tag }}"
          version="${tag#release-}"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          # The app reports Cargo.toml's version: the tag must say the same.
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $tag does not match the version in Cargo.toml ($crate): bump it, or tag release-$crate"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build gf.app and .dmg (${{ matrix.arch }})
        id: package
        run: |
          dmg="$(scripts/package-macos.sh "${{ steps.version.outputs.version }}" | tail -1)"
          # A fixed name, so .../releases/latest/download/<name> always
          # gets the newest one (scripts/install.sh relies on it).
          fixed="$(dirname "$dmg")/gf-macos-${{ matrix.arch }}.dmg"
          mv "$dmg" "$fixed"
          (cd "$(dirname "$fixed")" && shasum -a 256 gf-macos-${{ matrix.arch }}.dmg > gf-macos-${{ matrix.arch }}.dmg.sha256)
          echo "dmg=$fixed" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: |
            ${{ steps.package.outputs.dmg }}
            ${{ steps.package.outputs.dmg }}.sha256
          retention-days: 7

  windows:
    name: Package (Windows)
    needs: [resolve, ci]
    # `ci` is skipped when the commit passed CI already; it must not have
    # failed. Nothing to release: nothing to package.
    if: ${{ !failure() && !cancelled() && needs.resolve.outputs.tag != '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Build gf.exe and .zip
        shell: pwsh
        run: |
          $version = "${{ needs.resolve.outputs.tag }}" -replace '^release-', ''
          # Fails when the tag does not match Cargo.toml (as the macOS job).
          ./scripts/package-windows.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: zip
          path: |
            dist/gf-windows-x64.zip
            dist/gf-windows-x64.zip.sha256
          retention-days: 7

  publish:
    name: Publish release
    needs: [resolve, macos, windows, ui-sweep]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: zip
          path: dist

      # For the "What's new" notes (docs/release-notes/<version>.md) and
      # the previous release tag to compare with.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
          path: src

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          DMG_ARM64: dist/gf-macos-arm64.dmg
          DMG_X64: dist/gf-macos-x86_64.dmg
          ZIP: dist/gf-windows-x64.zip
        run: |
          version="${TAG#release-}"
          whats_new="src/docs/release-notes/$version.md"
          previous="$(git -C src tag -l 'release-*' --sort=-v:refname | grep -vxF "$TAG" | head -1)"
          {
            # Written by hand for each release; without it GitHub lists the
            # merged changes instead (--generate-notes below).
            if [ -f "$whats_new" ]; then cat "$whats_new"; echo; fi
            cat <<NOTES
          ## Install or update

          ### macOS

          Run in Terminal on macOS 11 or later (Apple silicon or Intel):

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash
          \`\`\`

          ### Windows

          Run in PowerShell on Windows 10 1809+ or 11 (x64). It installs gf for the
          current user (no administrator rights), adds it to the Start menu and \`PATH\`,
          and checks the download's SHA-256:

          \`\`\`powershell
          irm https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.ps1 | iex
          \`\`\`

          gf is not code-signed yet, so SmartScreen may warn on the first launch
          ("More info" → "Run anyway").

          Git 2.43.1 or later is required ([Git for Windows](https://git-scm.com/download/win)
          on Windows). Every download has a \`.sha256\` checksum next to it.
          NOTES
            if [ -n "$previous" ]; then
              echo
              echo "[Compare with ${previous#release-}](https://github.com/${{ github.repository }}/compare/$previous...$TAG)"
            fi
          } > notes.md
          generate=()
          [ -f "$whats_new" ] || generate=(--generate-notes)
          # A pre-release (0.0.9-rc.1) must not become "latest": install.sh
          # downloads from releases/latest.
          channel=(--latest)
          case "$version" in *-*) channel=(--prerelease) ;; esac
          # The tag already exists (on a commit in main).
          gh release create "$TAG" \
            "$DMG_ARM64" "$DMG_ARM64.sha256" "$DMG_X64" "$DMG_X64.sha256" "$ZIP" "$ZIP.sha256" \
            --verify-tag \
            --title "gf $version" \
            --notes-file notes.md \
            "${generate[@]}" \
            "${channel[@]}"
