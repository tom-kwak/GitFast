name: Release

# A tag `release-<version>` (the workspace version in Cargo.toml) on a
# commit that is in main publishes a release with the macOS .dmg: either
# the tag is pushed onto a commit main already has, or main gets the
# tagged commit later (a merge of develop). A tag on a commit main does
# not have waits until main has it.
#
#   git tag release-0.0.2 && git push origin release-0.0.2
on:
  push:
    branches: [main]
    tags: ["release-*"]

# One at a time: a push of main and its tag together release once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Which tag to release: the newest release-* tag in main that has no
  # release yet (none: nothing to do).
  resolve:
    name: Find the tag to release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q --tags origin +refs/heads/main:refs/remotes/origin/main
          released="$(gh release list --limit 1000 --json tagName -q '.[].tagName')"
          tag=""
          for t in $(git tag -l 'release-*' --merged origin/main --sort=-v:refname); do
            if ! grep -qxF "$t" <<<"$released"; then tag="$t"; fi
            break
          done
          if [ -z "$tag" ]; then
            echo "No release tag in main without a release: nothing to publish."
          else
            echo "Releasing $tag ($(git rev-parse "$tag^{commit}"))"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  ci:
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.tag }}

  # Runs beside the checks and the .dmg build; the release waits for it.
  ui-sweep:
    name: UI sweep (every button does something)
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p gf-app -- --ignored sweep_

  macos:
    name: Package (macOS)
    needs: [resolve, ci]
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Version
        id: version
        run: |
          tag="${{ needs.resolve.outputs.tag }}"
          version="${tag#release-}"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          # The app reports Cargo.toml's version: the tag must say the same.
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $tag does not match the version in Cargo.toml ($crate): bump it, or tag release-$crate"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build gf.app and .dmg (Apple silicon + Intel)
        id: package
        env:
          UNIVERSAL: "1"
        run: |
          dmg="$(scripts/package-macos.sh "${{ steps.version.outputs.version }}" | tail -1)"
          # A fixed name, so .../releases/latest/download/<name> always
          # gets the newest one (scripts/install.sh relies on it).
          fixed="$(dirname "$dmg")/gf-macos-universal.dmg"
          mv "$dmg" "$fixed"
          (cd "$(dirname "$fixed")" && shasum -a 256 gf-macos-universal.dmg > gf-macos-universal.dmg.sha256)
          echo "dmg=$fixed" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: |
            ${{ steps.package.outputs.dmg }}
            ${{ steps.package.outputs.dmg }}.sha256
          retention-days: 7

  publish:
    name: Publish release
    needs: [macos, ui-sweep]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dmg
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.macos.outputs.tag }}
          DMG: dist/gf-macos-universal.dmg
        run: |
          cat > notes.md <<NOTES
          ## Install

          Paste in Terminal (installs or updates gf in Applications):

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash
          \`\`\`

          Universal build (Apple silicon + Intel), macOS 11+.
          NOTES
          # The tag already exists (on a commit in main).
          gh release create "$TAG" "$DMG" "$DMG.sha256" \
            --verify-tag \
            --title "gf ${TAG#release-}" \
            --notes-file notes.md \
            --generate-notes \
            --latest
